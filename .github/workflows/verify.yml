name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  root-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Capture typecheck result
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: root-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Fail on typecheck errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - name: Tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate local script syntax
        run: |
          bash -n scripts/start.sh
          bash -n scripts/start_mobile.sh
          bash -n scripts/setup_mobile_https.sh
          bash -n scripts/data_manager.sh
          python -m py_compile scripts/data_manager.py scripts/cert_server.py
      - name: Install core backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-core.txt
      - name: Run core backend tests
        working-directory: backend
        run: python -m unittest tests.test_calculation tests.test_data_paths
      - name: Import application without optional OCR packages
        working-directory: backend
        run: python -c 'from app.main import app; assert app.title == "kakeibo API"'
